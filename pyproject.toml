[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.0.15",
    "sentence-transformers>=5.0.0",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "python-dotenv>=1.1.1",
    "openai==3.42.1",
    "langchain-openai>=1.7.4",
    "langchain-core>=1.7.6",
    "pyjwt>=2.15.1",
    "email-validator>=2.3.0",
    "langsmith>=0.14.17",
    "pypdf>=7.0.0",
    "python-docx>=1.2.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.8",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses Depends(...) in argument defaults
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# app.py must set the warnings filter before importing rag_system (which pulls in chromadb)
"backend/app.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
check_untyped_defs = true
