# Deployment with shared state: PostgreSQL + pgvector (users, feedback, messages AND the course
# vectors), Redis (sessions, rate limits) and a one-off `ingest` job, so the app container holds
# no per-process state and can be scaled: `docker compose up --scale app=3` behind a load
# balancer (drop the fixed `ports:` mapping first).
# Expects a .env file (see .env.example) with LLM_API_KEY, JWT_SECRET, ...
# Put a TLS-terminating reverse proxy in front, then set ALLOWED_HOSTS / ALLOWED_ORIGINS,
# ENABLE_HSTS=true and FORWARDED_ALLOW_IPS to match it.
#
# Course vectors live in PostgreSQL (VECTOR_BACKEND=pgvector), not in the Chroma volume. After
# switching from Chroma, run the ingest job once; re-run with --clear if you change
# EMBEDDING_MODEL / EMBEDDING_PROVIDER (the app refuses to search a mismatched index).
x-app-env: &app-env
  DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/rag
  REDIS_URL: redis://redis:6379/0
  VECTOR_BACKEND: pgvector
  INGEST_ON_STARTUP: "false"

services:
  postgres:
    image: pgvector/pgvector:pg17  # PostgreSQL 17 with the pgvector extension
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rag
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # sessions/limits are disposable
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Indexes ../docs into Chroma, then exits. Re-run after adding courses:
  #   docker compose run --rm ingest python ingest.py [--clear]
  ingest:
    image: ragchatbot-app:local  # the app's image (built by the app service below)
    pull_policy: never
    env_file: .env
    environment: *app-env
    command: ["python", "ingest.py"]
    volumes:
      - app-data:/data
    restart: "no"

  app:
    build: .
    image: ragchatbot-app:local
    env_file: .env
    environment:
      <<: *app-env
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "8000:8000"
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  app-data:
  pg-data:
