# Deployment with shared state: PostgreSQL (users, feedback, messages), Redis (sessions, rate
# limits) and a one-off `ingest` job, so the app container itself holds no per-process state.
# Expects a .env file (see .env.example) with LLM_API_KEY, JWT_SECRET, ...
# Put a TLS-terminating reverse proxy in front, then set ALLOWED_HOSTS / ALLOWED_ORIGINS,
# ENABLE_HSTS=true and FORWARDED_ALLOW_IPS to match it.
#
# The vector store is still embedded Chroma on a volume, so run ONE app container until it
# moves to a server (see the production plan, Phase 2).
x-app-env: &app-env
  DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/rag
  REDIS_URL: redis://redis:6379/0
  INGEST_ON_STARTUP: "false"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rag
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # sessions/limits are disposable
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Indexes ../docs into Chroma, then exits. Re-run after adding courses:
  #   docker compose run --rm ingest python ingest.py [--clear]
  ingest:
    build: .
    env_file: .env
    environment: *app-env
    command: ["python", "ingest.py"]
    volumes:
      - app-data:/data
    restart: "no"

  app:
    build: .
    env_file: .env
    environment:
      <<: *app-env
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "8000:8000"
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  app-data:
  pg-data:
